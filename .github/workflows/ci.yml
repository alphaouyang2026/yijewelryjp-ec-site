name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build and synth
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # API tests create one table per test file in DynamoDB Local (in-memory by default).
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8100:8000

    env:
      DYNAMODB_ENDPOINT: http://localhost:8100

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: API tests
        run: npm run test:api

      - name: Frontend tests
        run: npm run test:web

      - name: Frontend build
        run: npm run build

      # Synthesizes every stack the way a deploy would (the shop stacks upload
      # the frontend build above), without AWS credentials.
      - name: CDK synth (staging, production)
        run: |
          npm run synth -w @yi/infra -- -c stage=staging
          npm run synth -w @yi/infra -- -c stage=production

      - name: CDK synth with a custom domain
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          DOMAIN_NAME: shop.example.com
          HOSTED_ZONE_ID: Z0000000000EXAMPLE
          HOSTED_ZONE_NAME: example.com
        run: npm run synth -w @yi/infra -- -c stage=production

      - name: CDK synth of the deploy access stack
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
        run: npm run synth -w @yi/infra -- -c deployAccess=true
